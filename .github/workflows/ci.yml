# CI: lint, type check, workflow security check, tests on Linux / Windows, and the end-to-end
# test with Docker. "CI result" is the single check required by the main ruleset. macOS is
# tested once a week in weekly.yml (GitHub's macOS runners are scarce; a queue there should not
# block pull requests).
# CI: lint・型の検査・ワークフローの安全性の検査・Linux / Windows のテスト・Docker を使う
# 実起動の試験。main のルールで必須にするのは「CI result」の1つだけ。macOS は weekly.yml で
# 週に1回確かめる（GitHub の macOS の runner は数が少なく、その待ちで PR を止めないため）。
#
# Docs-only changes (*.md, docs/images/, .github/pages/) skip the heavy jobs (the test matrix
# and the end-to-end test); lint and zizmor always run. The workflow itself always runs, so the
# required "CI result" is always reported (with paths-ignore it would never arrive and the PR
# could not be merged).
# ドキュメントだけの変更（*.md・docs/images/・.github/pages/）では、重いジョブ（テストの
# matrix と実起動の試験）を飛ばす。lint と zizmor は毎回動かす。ワークフローそのものは毎回
# 動かすので、必須の「CI result」は必ず届く（paths-ignore だと届かず、PR をマージできない）。
#
# Security / 安全のために:
# - every action is pinned to a commit SHA (tags can be moved) / Actions は commit の SHA で固定する
# - the token is read-only by default; each job gets only what it needs
#   トークンの既定の権限は空にし、ジョブごとに必要なものだけを付ける
# - no pull_request_target, and checkout does not keep credentials
#   pull_request_target は使わず、checkout で認証情報を残さない
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.4"
  PYTHONIOENCODING: utf-8
  # PyYAML has no wheel for Python 3.15 yet; build it without the C extension
  # PyYAML に 3.15 の wheel がまだないので、C 拡張なしで作る
  PYYAML_FORCE_LIBYAML: "0"

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # code=false only when every changed file is documentation. Anything unknown (a manual
      # run, the first push of a branch) counts as code, so the heavy jobs run
      # 変わったファイルがすべてドキュメントのときだけ code=false。分からないとき（手動の実行、
      # ブランチの最初の push）はコードとみなして、重いジョブを動かす
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$BASE...HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            range="$BEFORE..HEAD"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md | docs/images/* | .github/pages/*) echo "docs: $file" ;;
              *) echo "code: $file"; code=true ;;
            esac
          done < <(git diff --name-only "$range")
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint (ruff, mypy)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # zizmor reads workflow runs for its online audits / zizmor がオンラインの検査で読む
      security-events: write # upload the findings to code scanning / 結果を code scanning に送る
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }}, pytest ${{ matrix.pytest }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        pytest: ["8", "9"]
        include:
          - {os: windows-2025, python: "3.11", pytest: "9"}
          - {os: windows-2025, python: "3.15", pytest: "9"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      # uv.lock has pytest 9; replace it with the latest pytest 8 for the pytest 8 jobs
      # uv.lock は pytest 9 なので、pytest 8 の組だけ pytest 8 の最新に入れ替える
      - if: matrix.pytest == '8'
        run: uv pip install "pytest>=8,<9"
      - run: uv run --no-sync python -c "import sys, pytest; print(sys.version, pytest.__version__)"
      - run: uv run --no-sync pytest -p no:cacheprovider

  integration:
    name: End-to-end test (PostgreSQL + API with Docker)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: bash scripts/integration.sh
      - if: failure()
        run: tail -n 100 reports/integration/*.txt reports/integration/*.log 2>/dev/null || true

  result:
    name: CI result
    if: always()
    needs: [changes, lint, zizmor, test, integration]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      # "skipped" is fine (the heavy jobs skip on docs-only changes), but the change detection
      # itself must succeed: if it failed, the heavy jobs were skipped for the wrong reason
      # skipped はよい（ドキュメントだけの変更では重いジョブを飛ばす）が、変更の判定そのものは
      # 成功していなければならない（失敗していれば、重いジョブは間違った理由で飛ばされている）
      - env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes: $CHANGES / results: $RESULTS"
          if [ "$CHANGES" != "success" ]; then
            echo "the change detection did not succeed: $CHANGES"
            exit 1
          fi
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "a required job did not succeed: $r"; exit 1 ;;
            esac
          done
