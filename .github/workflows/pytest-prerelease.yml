# Weekly check against upcoming pytest versions: the latest pre-release on PyPI and the main
# branch of pytest. pytest-casebook puts pytest.Function items under YAML files, which relies a
# little on pytest's internals, so this finds breakage before a pytest release reaches users.
# A failure here does not block anything; GitHub mails the failure of a scheduled run.
# 週に1回、これから出る pytest（PyPI のプレリリースの最新と、pytest の main ブランチ）で
# テストを流す。YAML のファイルの下に pytest.Function を置く作りは pytest の内部の動きに
# 少し頼っているので、pytest のリリースが利用者に届く前に壊れたことに気づくため。
# ここが失敗しても何も止めない（定期実行の失敗は GitHub がメールで知らせる）。
#
# Security / 安全のために: same as ci.yml (actions pinned to SHAs, read-only token, no
# credentials kept by checkout). pytest's main branch is installed from GitHub, but the job
# has no secrets and no write permissions.
# ci.yml と同じ（Actions は SHA で固定、トークンは読むだけ、checkout で認証情報を残さない）。
# pytest の main は GitHub から入れるが、このジョブには秘密の値も書き込みの権限もない。
name: pytest pre-release

on:
  schedule:
    - cron: "23 3 * * 1" # Mondays 03:23 UTC / 毎週月曜 12:23（日本時間）
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.4"
  PYTHONIOENCODING: utf-8
  # PyYAML has no wheel for Python 3.15 yet; build it without the C extension
  # PyYAML に 3.15 の wheel がまだないので、C 拡張なしで作る
  PYYAML_FORCE_LIBYAML: "0"

jobs:
  test:
    name: Test (Python ${{ matrix.python }}, pytest ${{ matrix.pytest }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
        pytest: [pre-release, main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: false
      - run: uv sync --frozen
      # The newest pytest and pluggy on PyPI, pre-releases included (the latest release when
      # there is no newer pre-release)
      # PyPI のプレリリースも含めた最新の pytest と pluggy（新しいプレリリースがなければ最新の版）
      - if: matrix.pytest == 'pre-release'
        run: uv pip install --upgrade --prerelease allow pytest pluggy
      - if: matrix.pytest == 'main'
        run: uv pip install "pytest @ git+https://github.com/pytest-dev/pytest@main"
      - run: uv run --no-sync python -c "import sys, pluggy, pytest; print(sys.version, pytest.__version__, pluggy.__version__)"
      - run: uv run --no-sync pytest -p no:cacheprovider
